<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>compare（比較表）</title>
<link rel="stylesheet" href="/shared/fonts.css">
<link rel="stylesheet" href="/shared/base.css">
<style>
  .wrap { width: 100%; }
  table { width: 100%; border-collapse: separate; border-spacing: 0; table-layout: fixed; }
  th, td { height: var(--rowh); padding: 0 20px; text-align: center; border-bottom: 2px solid #e7e5f0; }
  thead th { background: var(--primary); color: #fff; font-weight: 700; border-bottom: none; }
  thead th.corner { background: transparent; }
  thead th:nth-child(2) { border-top-left-radius: 16px; }
  thead th:last-child { border-top-right-radius: 16px; }
  tbody th { background: var(--surface); font-weight: 700; text-align: left; }
  tbody tr:first-child th { border-top-left-radius: 16px; }
  tbody tr:last-child th { border-bottom-left-radius: 16px; }
  tbody tr:last-child th, tbody tr:last-child td { border-bottom: none; }
  .cell { white-space: nowrap; overflow: hidden; line-height: 1.3; }
  td .cell { font-weight: 700; }
  .mark { font-weight: 900; }
  .good { color: var(--good); }
  .mid { color: var(--accent); }
  .bad { color: var(--bad); }
</style>
</head>
<body>
<main class="frame">
  <header class="head"><h1 class="title"></h1><p class="subtitle"></p></header>
  <section class="body" id="body"></section>
  <footer class="foot"><span class="footer"></span><span class="brand"></span></footer>
</main>
<script src="/shared/diagram.js"></script>
<script>
  const MARKS = { '◎': 'good', '○': 'good', '〇': 'good', '✓': 'good', '△': 'mid', '×': 'bad', '✕': 'bad', '✗': 'bad' };

  // items: { columns: [...], rows: [{ label, values: [...] }] }
  window.drawBody = function (items, body, { h }) {
    const rows = items.rows;
    const rowh = Math.min(78, Math.floor(430 / (rows.length + 1)));
    const size = rows.length <= 4 ? 28 : rows.length <= 6 ? 25 : 23;
    const table = h('table');
    table.style.setProperty('--rowh', `${rowh}px`);
    const head = h('tr');
    head.append(h('th', 'corner'));
    items.columns.forEach((c) => {
      const th = h('th');
      const cell = h('div', 'cell', c);
      cell.dataset.fit = `${size},16`;
      th.append(cell);
      head.append(th);
    });
    const thead = h('thead');
    thead.append(head);
    const tbody = h('tbody');
    rows.forEach((row) => {
      const tr = h('tr');
      const th = h('th');
      const label = h('div', 'cell', row.label);
      label.dataset.fit = `${size},16`;
      th.append(label);
      tr.append(th);
      row.values.forEach((v) => {
        const td = h('td');
        const mark = MARKS[String(v).trim()];
        const cell = h('div', 'cell' + (mark ? ` mark ${mark}` : ''), v);
        cell.dataset.fit = mark ? `${size + 10},16` : `${size},16`;
        td.append(cell);
        tr.append(td);
      });
      tbody.append(tr);
    });
    table.append(thead, tbody);
    const wrap = h('div', 'wrap');
    wrap.append(table);
    body.append(wrap);
  };

  window.SAMPLE = {
    title: '有料記事の価格帯の比較',
    subtitle: 'サンプル表示',
    items: {
      columns: ['500円', '980円', '1,480円'],
      rows: [
        { label: '買われやすさ', values: ['◎', '○', '△'] },
        { label: '入れられる量', values: ['少ない', 'ふつう', '多い'] },
        { label: '向いている内容', values: ['単発のコツ', 'テンプレ付き', '実データ込み'] },
      ],
    },
    footer: '',
    brand: 'AI編集部',
  };
  if (!window.__NO_SAMPLE__) window.renderDiagram(window.SAMPLE);
</script>
</body>
</html>
