<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>bar_chart（数値比較）</title>
<link rel="stylesheet" href="/shared/fonts.css">
<link rel="stylesheet" href="/shared/base.css">
<style>
  .chart { width: 100%; display: flex; flex-direction: column; gap: var(--gap); }
  .bar { display: grid; grid-template-columns: 270px 1fr; align-items: center; gap: 24px; }
  .label { font-weight: 700; text-align: right; white-space: nowrap; overflow: hidden; line-height: 1.3; }
  .track { position: relative; height: var(--barh); }
  .fill {
    position: absolute; inset: 0 auto 0 0;
    border-radius: 0 14px 14px 0;
    background: color-mix(in srgb, var(--primary) 32%, #ffffff);
    min-width: 6px;
  }
  .bar.hl .fill { background: var(--primary); }
  .val { position: absolute; top: 50%; transform: translateY(-50%); font-weight: 900; white-space: nowrap; line-height: 1; }
  .val small { font-size: 0.6em; font-weight: 700; margin-left: 4px; color: var(--muted); }
  .bar.hl .val { color: var(--primary); }
</style>
</head>
<body>
<main class="frame">
  <header class="head"><h1 class="title"></h1><p class="subtitle"></p></header>
  <section class="body" id="body"></section>
  <footer class="foot"><span class="footer"></span><span class="brand"></span></footer>
</main>
<script src="/shared/diagram.js"></script>
<script>
  const fmt = (v) => (Number.isInteger(v) ? v.toLocaleString('ja-JP') : v.toLocaleString('ja-JP', { maximumFractionDigits: 2 }));

  // items: { unit, bars: [{ label, value, highlight }] }（横棒。最大値を約8割の長さにする）
  window.drawBody = function (items, body, { h }) {
    const bars = items.bars;
    const max = Math.max(...bars.map((b) => b.value), 0) || 1;
    const barh = Math.min(64, Math.floor(380 / bars.length) - 14);
    const chart = h('div', 'chart');
    chart.style.setProperty('--barh', `${barh}px`);
    chart.style.setProperty('--gap', `${Math.min(26, Math.floor(420 / bars.length) - barh)}px`);
    const labelSize = bars.length <= 4 ? 28 : 24;
    bars.forEach((b) => {
      const row = h('div', 'bar' + (b.highlight ? ' hl' : ''));
      const label = h('div', 'label', b.label);
      label.dataset.fit = `${labelSize},16`;
      const track = h('div', 'track');
      const pct = Math.max(0, (b.value / max) * 78);
      const fill = h('div', 'fill');
      fill.style.width = `${pct}%`;
      const val = h('div', 'val', fmt(b.value));
      if (items.unit) val.append(h('small', '', items.unit));
      val.style.left = `calc(${pct}% + 14px)`;
      val.style.fontSize = `${Math.min(34, barh * 0.62)}px`;
      track.append(fill, val);
      row.append(label, track);
      chart.append(row);
    });
    body.append(chart);
  };

  window.SAMPLE = {
    title: '図解1枚あたりの作業時間',
    subtitle: 'サンプル表示（架空の数値）',
    items: { unit: '分', bars: [{ label: '手作業', value: 20 }, { label: '画像生成AI＋手直し', value: 12 }, { label: 'AI＋テンプレート', value: 3, highlight: true }] },
    footer: '※デモ用の架空の数値です',
    brand: 'AI編集部',
  };
  if (!window.__NO_SAMPLE__) window.renderDiagram(window.SAMPLE);
</script>
</body>
</html>
