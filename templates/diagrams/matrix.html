<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>matrix（2軸マトリクス）</title>
<link rel="stylesheet" href="/shared/fonts.css">
<link rel="stylesheet" href="/shared/base.css">
<style>
  .mx { width: 100%; height: 100%; max-height: 460px; display: grid; grid-template-columns: 64px 1fr; grid-template-rows: 1fr 48px; }
  .yaxis { grid-row: 1; grid-column: 1; display: flex; flex-direction: column; justify-content: space-between; align-items: center; padding: 6px 0; }
  .xaxis { grid-row: 2; grid-column: 2; display: flex; justify-content: space-between; align-items: center; padding: 0 6px; }
  .axis-label { font-size: 20px; font-weight: 700; color: var(--muted); white-space: nowrap; }
  .yaxis .axis-label { writing-mode: vertical-rl; }
  .plot { grid-row: 1; grid-column: 2; position: relative; border-radius: 18px; overflow: hidden; background: var(--surface); }
  .quad { position: absolute; width: 50%; height: 50%; }
  .q1 { right: 0; top: 0; background: color-mix(in srgb, var(--primary) 12%, transparent); }
  .q3 { left: 0; bottom: 0; background: color-mix(in srgb, var(--muted) 8%, transparent); }
  .line-x, .line-y { position: absolute; background: color-mix(in srgb, var(--muted) 40%, transparent); }
  .line-x { left: 0; right: 0; top: 50%; height: 2px; }
  .line-y { top: 0; bottom: 0; left: 50%; width: 2px; }
  .pt { position: absolute; display: flex; align-items: center; gap: 10px; transform: translate(-13px, -50%); }
  .pt.flip { flex-direction: row-reverse; transform: translate(calc(-100% + 13px), -50%); }
  .dot { flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--primary); border: 4px solid #fff; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.18); }
  .pt.hl .dot { background: var(--accent); }
  .lbl { font-weight: 700; background: rgba(255, 255, 255, 0.94); padding: 4px 12px; border-radius: 10px; white-space: nowrap; max-width: 380px; overflow: hidden; line-height: 1.3; }
  .pt.hl .lbl { box-shadow: inset 0 0 0 3px var(--accent); }
</style>
</head>
<body>
<main class="frame">
  <header class="head"><h1 class="title"></h1><p class="subtitle"></p></header>
  <section class="body" id="body"></section>
  <footer class="foot"><span class="footer"></span><span class="brand"></span></footer>
</main>
<script src="/shared/diagram.js"></script>
<script>
  // items: { x_axis: [低, 高], y_axis: [低, 高], points: [{ label, x, y, highlight }] }（x, y は 0〜1。y は上ほど高い）
  window.drawBody = function (items, body, { h }) {
    const mx = h('div', 'mx');
    const yaxis = h('div', 'yaxis');
    yaxis.append(h('div', 'axis-label', `${items.y_axis[1]} ↑`), h('div', 'axis-label', items.y_axis[0]));
    const xaxis = h('div', 'xaxis');
    xaxis.append(h('div', 'axis-label', items.x_axis[0]), h('div', 'axis-label', `${items.x_axis[1]} →`));
    const plot = h('div', 'plot');
    plot.append(h('div', 'quad q1'), h('div', 'quad q3'), h('div', 'line-x'), h('div', 'line-y'));
    items.points.forEach((p) => {
      const pt = h('div', 'pt' + (p.highlight ? ' hl' : '') + (p.x > 0.62 ? ' flip' : ''));
      pt.style.left = `${6 + p.x * 88}%`;
      pt.style.top = `${94 - p.y * 88}%`;
      const lbl = h('div', 'lbl', p.label);
      lbl.dataset.fit = '24,15';
      pt.append(h('div', 'dot'), lbl);
      plot.append(pt);
    });
    mx.append(yaxis, plot, h('div'), xaxis);
    body.append(mx);
  };

  window.SAMPLE = {
    title: '自動化する作業の優先順位',
    subtitle: 'サンプル表示（横：手間の少なさ、縦：効果）',
    items: {
      x_axis: ['手間が多い', '手間が少ない'],
      y_axis: ['効果が小さい', '効果が大きい'],
      points: [
        { label: 'ネタ探し', x: 0.78, y: 0.82, highlight: true },
        { label: 'タイトル案', x: 0.86, y: 0.55 },
        { label: '本文の執筆', x: 0.22, y: 0.7 },
        { label: '図解づくり', x: 0.55, y: 0.62 },
        { label: 'ハッシュタグ', x: 0.8, y: 0.2 },
      ],
    },
    footer: '',
    brand: 'AI編集部',
  };
  if (!window.__NO_SAMPLE__) window.renderDiagram(window.SAMPLE);
</script>
</body>
</html>
