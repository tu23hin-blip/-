<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>flow（手順フロー）</title>
<link rel="stylesheet" href="/shared/fonts.css">
<link rel="stylesheet" href="/shared/base.css">
<style>
  .flow { width: 100%; display: flex; flex-direction: column; gap: 26px; }
  .row { display: flex; align-items: stretch; justify-content: center; }
  .node {
    flex: 1 1 0;
    max-width: 290px;
    min-width: 0;
    background: var(--surface);
    border-radius: 22px;
    padding: 22px 20px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }
  .num {
    width: 46px; height: 46px; border-radius: 50%;
    background: var(--primary); color: #fff;
    font-size: 24px; font-weight: 900;
    display: grid; place-items: center;
    margin-bottom: 12px;
  }
  .label {
    width: 100%;
    height: 84px;
    overflow: hidden;
    font-weight: 700;
    line-height: 1.35;
    display: flex; align-items: center; justify-content: center;
    word-break: auto-phrase;
  }
  .sub {
    width: 100%;
    height: 54px;
    overflow: hidden;
    margin-top: 6px;
    color: var(--muted);
    line-height: 1.35;
    word-break: auto-phrase;
  }
  .node.hl { background: var(--primary); color: #fff; box-shadow: 0 10px 24px color-mix(in srgb, var(--primary) 35%, transparent); }
  .node.hl .num { background: #fff; color: var(--primary); }
  .node.hl .sub { color: rgba(255, 255, 255, 0.86); }
  .arrow { flex: none; width: 54px; padding: 0 6px; display: grid; place-items: center; color: var(--primary); }
  .arrow .icon { width: 40px; height: 40px; }
  .flow.one .node { min-height: 300px; justify-content: center; }
  .flow.one .label { height: 96px; }
  .flow.one .sub { height: 60px; }
  .flow.small { gap: 18px; }
  .flow.small .label { height: 66px; }
  .flow.small .sub { height: 30px; margin-top: 2px; }
  .flow.small .node { padding: 14px 14px 10px; }
  .flow.small .num { width: 38px; height: 38px; font-size: 20px; margin-bottom: 6px; }
</style>
</head>
<body>
<main class="frame">
  <header class="head"><h1 class="title"></h1><p class="subtitle"></p></header>
  <section class="body" id="body"></section>
  <footer class="foot"><span class="footer"></span><span class="brand"></span></footer>
</main>
<script src="/shared/diagram.js"></script>
<script>
  // items: [{ label, sub, highlight }] を左から右へ。5個以上は2段に分ける
  window.drawBody = function (items, body, { h, svg, ICONS }) {
    const rows = items.length <= 4 ? [items] : [items.slice(0, Math.ceil(items.length / 2)), items.slice(Math.ceil(items.length / 2))];
    const flow = h('div', 'flow' + (rows.length > 1 ? ' small' : ' one'));
    let n = 0;
    rows.forEach((row) => {
      const r = h('div', 'row');
      row.forEach((item, i) => {
        if (i > 0) { const a = h('div', 'arrow'); a.append(svg(ICONS.arrow)); r.append(a); }
        n += 1;
        const node = h('div', 'node' + (item.highlight ? ' hl' : ''));
        node.append(h('div', 'num', n));
        const label = h('div', 'label', item.label);
        label.dataset.fit = rows.length > 1 ? '28,17' : '34,18';
        node.append(label);
        if (item.sub) {
          const sub = h('div', 'sub', item.sub);
          sub.dataset.fit = rows.length > 1 ? '20,14' : '22,14';
          node.append(sub);
        }
        r.append(node);
      });
      flow.append(r);
    });
    body.append(flow);
  };

  window.SAMPLE = {
    title: '図解ができるまでの流れ',
    subtitle: 'サンプル表示',
    items: [
      { label: '記事の本文', sub: '図にする位置を決める' },
      { label: 'AIが中身を決める', sub: 'JSONで出力', highlight: true },
      { label: 'テンプレートに流し込む', sub: '配色はジャンル別' },
      { label: 'PNGで書き出す', sub: '1280×720' },
    ],
    footer: '出典：AI編集部',
    brand: 'AI編集部',
  };
  if (!window.__NO_SAMPLE__) window.renderDiagram(window.SAMPLE);
</script>
</body>
</html>
