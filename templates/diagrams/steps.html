<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>steps（番号付きステップ）</title>
<link rel="stylesheet" href="/shared/fonts.css">
<link rel="stylesheet" href="/shared/base.css">
<style>
  .steps { width: 100%; display: grid; gap: 16px 36px; align-content: center; }
  .steps.two { grid-template-columns: 1fr 1fr; grid-auto-flow: column; }
  .step {
    display: flex; align-items: center; gap: 22px;
    background: var(--surface);
    border-radius: 18px;
    padding: 16px 26px;
    min-width: 0;
  }
  .n {
    flex: none;
    width: 60px; height: 60px; border-radius: 16px;
    background: var(--primary); color: #fff;
    font-size: 30px; font-weight: 900;
    display: grid; place-items: center;
  }
  .txt { min-width: 0; flex: 1; }
  .label { font-weight: 700; line-height: 1.35; white-space: nowrap; overflow: hidden; }
  .sub { margin-top: 2px; color: var(--muted); line-height: 1.35; white-space: nowrap; overflow: hidden; }
  .step.hl { background: var(--primary); color: #fff; }
  .step.hl .n { background: #fff; color: var(--primary); }
  .step.hl .sub { color: rgba(255, 255, 255, 0.86); }
</style>
</head>
<body>
<main class="frame">
  <header class="head"><h1 class="title"></h1><p class="subtitle"></p></header>
  <section class="body" id="body"></section>
  <footer class="foot"><span class="footer"></span><span class="brand"></span></footer>
</main>
<script src="/shared/diagram.js"></script>
<script>
  // items: [{ label, sub, highlight }] を上から番号付きで並べる。5個以上は2列
  window.drawBody = function (items, body, { h }) {
    const two = items.length >= 5;
    const list = h('div', 'steps' + (two ? ' two' : ''));
    if (two) list.style.gridTemplateRows = `repeat(${Math.ceil(items.length / 2)}, auto)`;
    items.forEach((item, i) => {
      const step = h('div', 'step' + (item.highlight ? ' hl' : ''));
      step.append(h('div', 'n', i + 1));
      const txt = h('div', 'txt');
      const label = h('div', 'label', item.label);
      label.dataset.fit = two ? '28,17' : '32,18';
      txt.append(label);
      if (item.sub) {
        const sub = h('div', 'sub', item.sub);
        sub.dataset.fit = two ? '19,14' : '22,15';
        txt.append(sub);
      }
      step.append(txt);
      list.append(step);
    });
    body.append(list);
  };

  window.SAMPLE = {
    title: 'noteで有料記事を出す手順',
    subtitle: 'サンプル表示',
    items: [
      { label: '無料部分を書く', sub: '結果と理由まで見せる' },
      { label: '有料ラインを引く', sub: '予告文の直後に置く', highlight: true },
      { label: '価格を決める', sub: '最初は980円前後から' },
      { label: 'マガジンに追加する', sub: 'まとめ買いの導線' },
    ],
    footer: '',
    brand: 'AI編集部',
  };
  if (!window.__NO_SAMPLE__) window.renderDiagram(window.SAMPLE);
</script>
</body>
</html>
