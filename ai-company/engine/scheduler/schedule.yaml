# 定時実行の設定（時刻は TZ = .env の TZ、既定 Asia/Tokyo）
# cron 形式: "分 時 日 月 曜日"（曜日 0=日, 1=月 … 6=土）
# args は対象の部門など（例: materials の research は args: [x-note]）。
# 違う事業部は並列で動きます。同じ事業部は二重起動しません（実行中ならスキップ）。
retry: 1                # 失敗時のリトライ回数（最大1）
retry_delay_seconds: 60

jobs:
  - division: metrics
    job: x
    cron: "0 6 * * *"       # 毎朝6時: X の投稿の数字を取り込み（7時の生成より前）。失敗しても他のジョブは動く
  - division: materials
    job: research
    args: [x-note]
    cron: "30 6 * * 1,4"    # 月・木 6:30: テーマのリサーチ（メインだけ。アナリストの8時より前）
  - division: x-note
    job: daily
    cron: "0 7 * * *"       # 毎朝7時: X投稿案3本
  - division: x-note
    job: weekly-note
    cron: "30 7 * * 6"      # 土曜7:30: note記事の下書き
  - division: analyst
    job: weekly
    cron: "0 8 * * 1"       # 月曜8時: 週次レポート
  - division: analyst
    job: midweek
    cron: "0 8 * * 4"       # 木曜8時: 中間レポート（直近7日）
  - division: short-video
    job: main
    cron: "0 9 * * *"       # ショート動画事業部
